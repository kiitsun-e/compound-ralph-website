<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f0d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1a15;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff9f;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- Center circle (loop indicator) -->
  <circle cx="300" cy="300" r="80" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.3"/>
  <text x="300" y="290" text-anchor="middle" fill="#00e5ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">RALPH</text>
  <text x="300" y="310" text-anchor="middle" fill="#00ff9f" font-family="system-ui, sans-serif" font-size="14" font-weight="600">LOOP</text>

  <!-- Outer ring for phases -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#1a2f25" stroke-width="2"/>

  <!-- Arrows showing direction (clockwise) -->
  <path d="M 300 80 A 220 220 0 0 1 520 300" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8,4" filter="url(#glow)"/>
  <path d="M 520 300 A 220 220 0 0 1 300 520" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8,4" filter="url(#glow)"/>
  <path d="M 300 520 A 220 220 0 0 1 80 300" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8,4" filter="url(#glow)"/>
  <path d="M 80 300 A 220 220 0 0 1 300 80" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8,4" filter="url(#glow)"/>

  <!-- Phase 0: Discovery (top) -->
  <g transform="translate(300, 60)">
    <circle r="35" fill="#0a0f0d" stroke="#00e5ff" stroke-width="2"/>
    <text y="-5" text-anchor="middle" fill="#00e5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">0</text>
    <text y="10" text-anchor="middle" fill="#e0f2e9" font-family="system-ui, sans-serif" font-size="9">Discovery</text>
  </g>

  <!-- Phase 1: Environment (top-right) -->
  <g transform="translate(455, 145)">
    <circle r="35" fill="#0a0f0d" stroke="#00e5ff" stroke-width="2"/>
    <text y="-5" text-anchor="middle" fill="#00e5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">1</text>
    <text y="10" text-anchor="middle" fill="#e0f2e9" font-family="system-ui, sans-serif" font-size="9">Environment</text>
  </g>

  <!-- Phase 2: Orient (right) -->
  <g transform="translate(520, 300)">
    <circle r="35" fill="#0a0f0d" stroke="#00e5ff" stroke-width="2"/>
    <text y="-5" text-anchor="middle" fill="#00e5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">2</text>
    <text y="10" text-anchor="middle" fill="#e0f2e9" font-family="system-ui, sans-serif" font-size="9">Orient</text>
  </g>

  <!-- Phase 3: Select Task (bottom-right) -->
  <g transform="translate(455, 455)">
    <circle r="35" fill="#0a0f0d" stroke="#00e5ff" stroke-width="2"/>
    <text y="-5" text-anchor="middle" fill="#00e5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">3</text>
    <text y="10" text-anchor="middle" fill="#e0f2e9" font-family="system-ui, sans-serif" font-size="9">Select Task</text>
  </g>

  <!-- Phase 4: Investigate (bottom) -->
  <g transform="translate(300, 540)">
    <circle r="35" fill="#0a0f0d" stroke="#00e5ff" stroke-width="2"/>
    <text y="-5" text-anchor="middle" fill="#00e5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">4</text>
    <text y="10" text-anchor="middle" fill="#e0f2e9" font-family="system-ui, sans-serif" font-size="9">Investigate</text>
  </g>

  <!-- Phase 5: Implement (bottom-left) -->
  <g transform="translate(145, 455)">
    <circle r="35" fill="#0a0f0d" stroke="#00ff9f" stroke-width="2"/>
    <text y="-5" text-anchor="middle" fill="#00ff9f" font-family="system-ui, sans-serif" font-size="11" font-weight="600">5</text>
    <text y="10" text-anchor="middle" fill="#e0f2e9" font-family="system-ui, sans-serif" font-size="9">Implement</text>
  </g>

  <!-- Phase 6: Validate (left) -->
  <g transform="translate(80, 300)">
    <circle r="35" fill="#0a0f0d" stroke="#00ff9f" stroke-width="2"/>
    <text y="-5" text-anchor="middle" fill="#00ff9f" font-family="system-ui, sans-serif" font-size="11" font-weight="600">6</text>
    <text y="10" text-anchor="middle" fill="#e0f2e9" font-family="system-ui, sans-serif" font-size="9">Validate</text>
  </g>

  <!-- Phase 7: Integration (top-left) -->
  <g transform="translate(145, 145)">
    <circle r="35" fill="#0a0f0d" stroke="#00ff9f" stroke-width="2"/>
    <text y="-5" text-anchor="middle" fill="#00ff9f" font-family="system-ui, sans-serif" font-size="11" font-weight="600">7</text>
    <text y="10" text-anchor="middle" fill="#e0f2e9" font-family="system-ui, sans-serif" font-size="9">Integration</text>
  </g>

  <!-- State Files annotation -->
  <g transform="translate(300, 380)">
    <rect x="-60" y="-20" width="120" height="40" rx="5" fill="#0a0f0d" stroke="#6b8f7a" stroke-width="1"/>
    <text y="5" text-anchor="middle" fill="#6b8f7a" font-family="system-ui, sans-serif" font-size="10">State Files</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 560)">
    <circle cx="10" cy="0" r="6" fill="none" stroke="#00e5ff" stroke-width="2"/>
    <text x="25" y="4" fill="#6b8f7a" font-family="system-ui, sans-serif" font-size="10">Context phases</text>
  </g>
  <g transform="translate(150, 560)">
    <circle cx="10" cy="0" r="6" fill="none" stroke="#00ff9f" stroke-width="2"/>
    <text x="25" y="4" fill="#6b8f7a" font-family="system-ui, sans-serif" font-size="10">Execution phases</text>
  </g>
</svg>
